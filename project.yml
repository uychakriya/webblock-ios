name: WebBlock
options:
  bundleIdPrefix: com.webblock
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  WebBlock:
    type: application
    platform: iOS
    sources: [WebBlock]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.webblock.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: WebBlock
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Choose a logo, profile photo or product photo.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
  WebBlockUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITestsTemp]
    dependencies:
      - target: WebBlock
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.webblock.app.uitests
        TEST_TARGET_NAME: WebBlock
schemes:
  WebBlock:
    build:
      targets:
        WebBlock: all
    run:
      config: Debug
    archive:
      config: Release
  WebBlockUITestsTemp:
    build:
      targets:
        WebBlock: all
        WebBlockUITests: [test]
    test:
      targets: [WebBlockUITests]
